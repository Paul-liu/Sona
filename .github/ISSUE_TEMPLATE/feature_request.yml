name: ✨ 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！如果想讨论大方向，也可以先去 [Discussions](https://github.com/paulliu/Sona/discussions)。

  - type: textarea
    id: problem
    attributes:
      label: 想要解决的问题
      description: 你现在遇到什么不便？为什么需要这个功能？
      placeholder: 每次重启后云端歌单都要重新导入，很麻烦
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？
      placeholder: 把歌单元数据持久化到本地，启动时自动恢复
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 有没有替代做法？为什么觉得当前方案更好？

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 本地音乐
        - 云端网盘
        - 播放器内核
        - 界面/交互
        - 接入新网盘
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 参考实现、截图、其他播放器是怎么做的等等

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与开发
      options:
        - label: 我愿意提交 PR 实现这个功能
          required: false
